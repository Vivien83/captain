[package]
name = "captain-extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Extension & integration system for Captain — one-click MCP server setup, credential vault, OAuth2 PKCE"

[dependencies]
captain-types = { path = "../captain-types" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
oauth2 = { workspace = true }
axum = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
dirs = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
fs2 = { workspace = true }
futures = { workspace = true }
lettre = { workspace = true }

# Encryption
aes-gcm = { workspace = true }
argon2 = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native-sync-persistent", "crypto-rust", "vendored"] }

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
