[package]
name = "captain-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Outbound-only lightweight execution node for Captain Hub"

[dependencies]
captain-types = { path = "../captain-types" }
captain-wire = { path = "../captain-wire" }
bytes = { workspace = true }
fs2 = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
libc = "0.2"
rand = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
reqwest-websocket = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true, features = ["serde"] }

[dev-dependencies]
axum = { workspace = true }
captain-api = { path = "../captain-api", default-features = false }
captain-kernel = { path = "../captain-kernel", default-features = false }
captain-runtime = { path = "../captain-runtime", default-features = false }
tempfile = "3"
