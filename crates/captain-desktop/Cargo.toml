[package]
name = "captain-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native desktop application for the Captain Agent OS (Tauri 2.0)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
captain-extensions = { path = "../captain-extensions" }
captain-node = { path = "../captain-node" }
captain-wire = { path = "../captain-wire" }
axum = { workspace = true }
bytes = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
reqwest-websocket = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { workspace = true }

[features]
# Tauri uses custom-protocol in production builds
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "captain-desktop"
path = "src/main.rs"
