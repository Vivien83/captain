[package]
name = "captain-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native desktop application for the Captain Agent OS (Tauri 2.0)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
captain-console = { path = "../captain-console" }
captain-wire = { path = "../captain-wire" }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

[features]
# Tauri uses custom-protocol in production builds
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "captain-desktop"
path = "src/main.rs"
